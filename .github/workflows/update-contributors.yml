# Refreshes the contributor faces under "Meet us" on the homepage.
#
# The org ruleset requires a reviewed pull request on main, so this opens a
# rolling PR rather than committing directly. Merging that PR triggers the
# usual Pages deploy.
name: Update contributors

on:
  # Runs every Monday at 12:00 UTC
  schedule:
    - cron: "0 12 * * 1"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "update-contributors"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/update-contributors
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Refresh contributor data
        run: node scripts/update-contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage any changes
        id: changes
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Contributor list is unchanged; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit \
            --message "README: refresh contributor faces" \
            --message "Regenerated from the GitHub API by the weekly update-contributors workflow."
          git push --force origin "$BRANCH"

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR already exists; the force-push updated it."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'BODY'
          Refreshes the avatars under "Meet us" from the GitHub API, sorted by total commit count across the public roostorg repos.

          Generated by `scripts/update-contributors.mjs` via the weekly `update-contributors` workflow. To keep someone off the list, add their handle to `data/contributors-exclude.json`.
          BODY

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh contributor faces" \
            --body-file /tmp/pr-body.md
